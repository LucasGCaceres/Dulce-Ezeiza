$kind: http-request
description: Borra {{imagenId3}} y {{imagenId4}} juntas en un solo pedido. Al producto le queda una sola imagen ({{imagenId1}}).
url: "{{baseUrl}}/productos/{{productoId}}/imagenes"
method: DELETE
headers:
  Content-Type: application/json
  x-access-token: "{{tokenAdmin}}"
body:
  type: json
  content: |-
    {
        "imagenesIds": [{{imagenId3}}, {{imagenId4}}]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 16000
