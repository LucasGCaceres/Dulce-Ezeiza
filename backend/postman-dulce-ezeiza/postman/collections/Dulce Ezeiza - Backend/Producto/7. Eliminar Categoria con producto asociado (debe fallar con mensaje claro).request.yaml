$kind: http-request
description: "Usa {{categoriaSeedId}} (categoria del seed, 'Panaderia' por defecto), que siempre tiene 4 productos precargados. (Es la misma prueba que '7. Eliminar Categoria con producto asociado' de la carpeta Categoria; esta esta duplicada aca para poder correr la carpeta Producto de punta a punta sin depender de la carpeta Categoria.)"
url: "{{baseUrl}}/categorias/{{categoriaSeedId}}"
method: DELETE
headers:
  x-access-token: "{{tokenAdmin}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 400', function () {
          pm.response.to.have.status(400);
      });
      pm.test('Mensaje claro de regla de negocio, no el error crudo de SQL', function () {
          const jsonData = pm.response.json();
          pm.expect(jsonData.mensaje).to.eql('No se puede eliminar la categoria: tiene productos asociados');
      });
    language: text/javascript
order: 7000