$kind: http-request
url: "{{baseUrl}}/usuarios/perfil"
method: GET
headers:
  x-access-token: "{{tokenAdmin}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', function () {
          pm.response.to.have.status(200);
      });
      const jsonData = pm.response.json();
      pm.test('No trae password', function () {
          pm.expect(jsonData.password).to.be.undefined;
      });
      pm.test('Es el usuario correcto', function () {
          pm.expect(jsonData.email).to.eql(pm.collectionVariables.get('adminEmail'));
      });
    language: text/javascript
order: 4000
