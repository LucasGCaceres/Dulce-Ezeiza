$kind: http-request
description: "Deja la contraseña del admin como estaba ({{adminPassword}}). Sin este paso, la proxima corrida de la coleccion fallaria desde el primer login. Si alguna vez se corta la coleccion entre la 8 y esta, la contraseña del admin queda en {{adminPasswordNueva}}: corre esta request a mano para arreglarlo."
url: "{{baseUrl}}/usuarios/cambiar-password"
method: PUT
headers:
  Content-Type: application/json
  x-access-token: "{{tokenAdmin}}"
body:
  type: json
  content: |-
    {
        "passwordActual": "{{adminPasswordNueva}}",
        "passwordNueva": "{{adminPassword}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200 - la contraseña volvio a la original', function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 11000
