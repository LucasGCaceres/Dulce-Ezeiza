$kind: http-request
description: "Crear una consulta es publico, pero verlas es solo para el admin."
url: "{{baseUrl}}/consultas"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 401 - falta token', function () {
          pm.response.to.have.status(401);
      });
    language: text/javascript
order: 5000
