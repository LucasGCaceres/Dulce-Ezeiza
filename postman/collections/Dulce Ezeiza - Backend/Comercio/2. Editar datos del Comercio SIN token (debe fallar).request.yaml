$kind: http-request
url: "{{baseUrl}}/comercio"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "horarios": "Esto no deberia guardarse"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 401 - falta token', function () {
          pm.response.to.have.status(401);
      });
    language: text/javascript
order: 2000
