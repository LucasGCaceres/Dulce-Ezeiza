$kind: http-request
description: "La informacion institucional del comercio la ve cualquier visitante. Guarda los horarios actuales en {{horariosOriginales}} para que la request 4 los pueda restaurar."
url: "{{baseUrl}}/comercio"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', function () {
          pm.response.to.have.status(200);
      });
      const jsonData = pm.response.json();
      pm.test('Trae el nombre del comercio', function () {
          pm.expect(jsonData.nombre).to.be.a('string');
      });
      pm.collectionVariables.set('horariosOriginales', jsonData.horarios);
    language: text/javascript
order: 1000
