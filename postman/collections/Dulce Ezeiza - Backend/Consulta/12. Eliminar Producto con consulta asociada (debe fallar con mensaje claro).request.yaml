$kind: http-request
description: "Regla espejo de 'Eliminar Categoria con producto asociado': la consulta de la request 3 (Crear Consulta sobre un Producto) sigue apuntando a {{productoId}}, asi que el borrado
  tiene que ser rechazado con un mensaje claro, no con el error crudo de la foreign key."
url: "{{baseUrl}}/productos/{{productoId}}"
method: DELETE
headers:
  x-access-token: "{{tokenAdmin}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 400', function () {
          pm.response.to.have.status(400);
      });
      pm.test('Mensaje claro de regla de negocio, no el error crudo de SQL', function () {
          const jsonData = pm.response.json();
          pm.expect(jsonData.mensaje).to.eql('No se puede eliminar el producto: tiene consultas asociadas');
      });
    language: text/javascript
order: 12000