$kind: http-request
description: "Como el endpoint es publico, el backend no confia en lo que llega. Esta request manda varios errores juntos (nombre en blanco, email sin @, asunto demasiado largo, productoId como texto) y espera que la respuesta los liste TODOS, no solo el primero."
url: "{{baseUrl}}/consultas"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "nombre": "     ",
        "email": "esto-no-es-un-email",
        "asunto": "{{asuntoLargo}}",
        "mensaje": "Mensaje valido",
        "productoId": "abc"
    }
scripts:
  - type: beforeRequest
    code: pm.variables.set('asuntoLargo', 'a'.repeat(201));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status 400', function () {
          pm.response.to.have.status(400);
      });
      const jsonData = pm.response.json();
      pm.test('Devuelve la lista de errores', function () {
          pm.expect(jsonData.errores).to.be.an('array');
          pm.expect(jsonData.errores.length).to.eql(4);
      });
      pm.test('Detecta cada problema', function () {
          const errores = jsonData.errores.join(' | ');
          pm.expect(errores).to.include('El nombre es obligatorio');
          pm.expect(errores).to.include('El email no tiene un formato valido');
          pm.expect(errores).to.include('asunto no puede superar los 200 caracteres');
          pm.expect(errores).to.include('productoId debe ser un numero entero');
      });
    language: text/javascript
order: 3000
