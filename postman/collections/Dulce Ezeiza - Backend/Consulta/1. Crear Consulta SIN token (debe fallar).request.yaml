$kind: http-request
description: "Sin token, la API tiene que rechazar la consulta con 401 (crear una consulta requiere estar logueado). Si esto te da 201, algo del middleware en la ruta no quedo bien aplicado."
url: "{{baseUrl}}/consultas"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "nombre": "Visitante Anonimo",
        "email": "visitante@test.com",
        "asunto": "Consulta de prueba",
        "mensaje": "Esto no deberia crearse porque no mande token."
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 401 - hay que estar logueado', function () {
          pm.response.to.have.status(401);
      });
    language: text/javascript
order: 1000
