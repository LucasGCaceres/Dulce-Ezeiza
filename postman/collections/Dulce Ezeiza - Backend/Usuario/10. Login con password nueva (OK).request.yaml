$kind: http-request
description: "Confirma que el cambio de password quedo guardado de verdad. De paso renueva {{tokenAdmin}}."
url: "{{baseUrl}}/usuarios/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "email": "{{adminEmail}}",
        "password": "{{adminPasswordNueva}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', function () {
          pm.response.to.have.status(200);
      });
      const jsonData = pm.response.json();
      if (jsonData.token) {
          pm.collectionVariables.set('tokenAdmin', jsonData.token);
      }
    language: text/javascript
order: 10000
