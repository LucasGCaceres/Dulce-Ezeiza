$kind: http-request
description: "La contraseña real del admin no deberia cambiar despues de esto -- por eso corre ANTES del cambio exitoso."
url: "{{baseUrl}}/usuarios/cambiar-password"
method: PUT
headers:
  Content-Type: application/json
  x-access-token: "{{tokenAdmin}}"
body:
  type: json
  content: |-
    {
        "passwordActual": "esto-no-es-la-actual",
        "passwordNueva": "{{adminPasswordNueva}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 400', function () {
          pm.response.to.have.status(400);
      });
      pm.test('Mensaje claro, no generico', function () {
          const jsonData = pm.response.json();
          pm.expect(jsonData.mensaje).to.eql('La contraseña actual es incorrecta');
      });
    language: text/javascript
order: 7000
