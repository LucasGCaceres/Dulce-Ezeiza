$kind: http-request
description: "Prueba con un codigo inventado que nunca se genero. Tiene que fallar con un mensaje claro."
url: "{{baseUrl}}/usuarios/resetear-password"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "token": "000000",
        "passwordNueva": "NoImporta123!"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 400', function () {
          pm.response.to.have.status(400);
      });
      pm.test('Mensaje claro', function () {
          const jsonData = pm.response.json();
          pm.expect(jsonData.mensaje).to.eql('El código de recuperación es inválido o venció');
      });
    language: text/javascript
order: 16000