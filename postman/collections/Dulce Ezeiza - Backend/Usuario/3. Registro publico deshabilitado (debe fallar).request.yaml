$kind: http-request
description: "El registro de clientes se elimino: el unico usuario es el admin, creado en la base. Este test confirma que la ruta ya no existe (404) y que nadie puede crearse una cuenta."
url: "{{baseUrl}}/usuarios/registro"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "nombre": "Alguien",
        "apellido": "Curioso",
        "email": "curioso@test.com",
        "password": "Curioso123!",
        "rol": "admin"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 404 - la ruta de registro ya no existe', function () {
          pm.response.to.have.status(404);
      });
    language: text/javascript
order: 3000
