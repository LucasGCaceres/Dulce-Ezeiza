$kind: http-request
description: "Usa el admin del seed (adminEmail/adminPassword ya vienen completados en las variables de coleccion). Si preferis loguearte con un admin propio creado a mano en SSMS, sobreescribi esas dos variables antes de correr esto."
url: "{{baseUrl}}/usuarios/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "email": "{{adminEmail}}",
        "password": "{{adminPassword}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', function () {
          pm.response.to.have.status(200);
      });
      const jsonData = pm.response.json();
      if (jsonData.token) {
          pm.collectionVariables.set('tokenAdmin', jsonData.token);
      }
    language: text/javascript
order: 7000
