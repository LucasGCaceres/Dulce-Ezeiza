$kind: http-request
url: "{{baseUrl}}/usuarios/cambiar-password"
method: PUT
headers:
  Content-Type: application/json
  x-access-token: "{{tokenCliente}}"
body:
  type: json
  content: |-
    {
        "passwordActual": "{{clientePassword}}",
        "passwordNueva": "{{clientePasswordNueva}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 11000
