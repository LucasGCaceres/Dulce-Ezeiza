$kind: http-request
description: "Corre esto DESPUES de que el request 17 haya funcionado, para confirmar que la contraseña realmente quedo guardada en la base."
url: "{{baseUrl}}/usuarios/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "email": "{{clienteEmail}}",
        "password": "{{clientePasswordRecuperada}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', function () {
          pm.response.to.have.status(200);
      });
      const jsonData = pm.response.json();
      if (jsonData.token) {
          pm.collectionVariables.set('tokenCliente', jsonData.token);
      }
    language: text/javascript
order: 18000