$kind: http-request
url: "{{baseUrl}}/usuarios/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "email": "{{adminEmail}}",
        "password": "{{adminPassword}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 401 - la vieja ya no sirve', function () {
          pm.response.to.have.status(401);
      });
    language: text/javascript
order: 9000
