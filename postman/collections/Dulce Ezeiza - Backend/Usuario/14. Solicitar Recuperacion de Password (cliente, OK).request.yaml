$kind: http-request
description: "Pide el codigo de recuperacion para {{clienteEmail}}. Como el codigo se manda por mail 
  (Ethereal, no un mail real), no llega en la respuesta de este request: despues de correrlo, mira la consola 
  del server y abri el link que imprime para ver el 'mail' con el codigo de 6 digitos."
url: "{{baseUrl}}/usuarios/recuperar-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "email": "{{clienteEmail}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Mensaje generico de confirmacion', function () {
          const jsonData = pm.response.json();
          pm.expect(jsonData.mensaje).to.eql('Si el email está registrado, te enviamos instrucciones para recuperar tu contraseña');
      });
    language: text/javascript
order: 14000