$kind: http-request
url: "{{baseUrl}}/usuarios/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "email": "{{clienteEmail}}",
        "password": "esto-esta-mal"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 401', function () {
          pm.response.to.have.status(401);
      });
      pm.test('Mensaje generico de credenciales invalidas', function () {
          const jsonData = pm.response.json();
          pm.expect(jsonData.mensaje).to.eql('Email o contraseña inválidos');
      });
    language: text/javascript
order: 6000
