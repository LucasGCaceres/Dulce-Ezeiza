$kind: http-request
description: "Este request NO se puede automatizar: el codigo de 6 digitos llega por mail (Ethereal), fuera del alcance de Postman. Pasos: 1) corre la request 12. 2) mira la consola del server y abri el link de Ethereal que imprime. 3) copia el codigo de 6 digitos y pegalo en la variable de coleccion 'codigoRecuperacion'. 4) recien ahi corre este request. Resetea a la MISMA contraseña original ({{adminPassword}}) a proposito, para que la coleccion siga siendo repetible. Si corres la coleccion entera sin hacer los pasos manuales, este test falla (es esperable)."
url: "{{baseUrl}}/usuarios/resetear-password"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "token": "{{codigoRecuperacion}}",
        "passwordNueva": "{{adminPassword}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 15000
