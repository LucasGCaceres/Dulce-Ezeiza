$kind: http-request
description: "Cambia la contraseña del admin a {{adminPasswordNueva}}. La request 11 la vuelve a poner como estaba, asi la coleccion se puede correr de nuevo sin tocar la base."
url: "{{baseUrl}}/usuarios/cambiar-password"
method: PUT
headers:
  Content-Type: application/json
  x-access-token: "{{tokenAdmin}}"
body:
  type: json
  content: |-
    {
        "passwordActual": "{{adminPassword}}",
        "passwordNueva": "{{adminPasswordNueva}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 8000
