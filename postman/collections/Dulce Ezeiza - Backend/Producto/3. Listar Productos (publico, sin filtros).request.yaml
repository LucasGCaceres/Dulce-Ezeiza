$kind: http-request
url: "{{baseUrl}}/productos"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200 y devuelve un array', function () {
          pm.response.to.have.status(200);
          pm.expect(pm.response.json()).to.be.an('array');
      });
    language: text/javascript
order: 3000
