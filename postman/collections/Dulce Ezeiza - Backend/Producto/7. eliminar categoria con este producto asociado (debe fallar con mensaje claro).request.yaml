$kind: http-request
description: "Punto 7. A esta altura ya existe el producto de '1. Crear Producto (admin, OK)', que usa {{categoriaId}}. La categoria tiene que sobrevivir a este intento de borrado -- la seguimos necesitando para las pruebas de Consulta."
url: "{{baseUrl}}/categorias/{{categoriaId}}"
method: DELETE
headers:
  x-access-token: "{{tokenAdmin}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 400', function () {
          pm.response.to.have.status(400);
      });
      pm.test('Mensaje claro de regla de negocio, no el error crudo de SQL', function () {
          const jsonData = pm.response.json();
          pm.expect(jsonData.mensaje).to.eql('No se puede eliminar la categoria: tiene productos asociados');
      });
    language: text/javascript
order: 7000