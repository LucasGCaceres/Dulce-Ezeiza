$kind: http-request
url: "{{baseUrl}}/productos/{{productoId}}"
method: PUT
headers:
  Content-Type: application/json
  x-access-token: "{{tokenAdmin}}"
body:
  type: json
  content: |-
    {
        "precio": 4800.0,
        "destacado": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 6000
