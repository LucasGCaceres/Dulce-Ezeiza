$kind: http-request
url: "{{baseUrl}}/productos/{{productoId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', function () {
          pm.response.to.have.status(200);
      });
      const jsonData = pm.response.json();
      pm.test('Queda una sola imagen, la que se agrego primero', function () {
          pm.expect(jsonData.imagenes).to.be.an('array').with.lengthOf(1);
          pm.expect(String(jsonData.imagenes[0].id)).to.eql(pm.collectionVariables.get('imagenId1'));
      });
    language: text/javascript
order: 17000
