$kind: http-request
description: "Usa {{productoSeedId}} (producto del seed, 'Pan Frances' por defecto) en vez del creado en la request 1, para probar el endpoint contra un dato precargado real."
url: "{{baseUrl}}/productos/{{productoSeedId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Es el producto del seed esperado', function () {
          const jsonData = pm.response.json();
          pm.expect(jsonData.nombre).to.eql(pm.collectionVariables.get('productoSeedNombre'));
      });
    language: text/javascript
order: 5000
