$kind: http-request
url: "{{baseUrl}}/categorias"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "nombre": "No Deberia Crearse",
        "descripcion": "sin token",
        "activa": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 401 - falta token', function () {
          pm.response.to.have.status(401);
      });
    language: text/javascript
order: 2000
