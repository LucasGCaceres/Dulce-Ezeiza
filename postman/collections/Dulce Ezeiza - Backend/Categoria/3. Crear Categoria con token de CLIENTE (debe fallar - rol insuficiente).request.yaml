$kind: http-request
description: "Un token de cliente valido no alcanza para crear una categoria: la autenticacion es correcta
  (sabemos quien es), pero la autorizacion falla (no tiene el rol admin, que exige el middleware verificarAdmin). Si esto te da 201 en vez de 403, revisa
  que hayas vuelto a hacer login DESPUES de agregar el rol al payload del JWT -- un token viejo no tiene rol adentro."
url: "{{baseUrl}}/categorias"
method: POST
headers:
  Content-Type: application/json
  x-access-token: "{{tokenCliente}}"
body:
  type: json
  content: |-
    {
        "nombre": "{{categoriaNombreCliente}}",
        "descripcion": "Creada con token de cliente",
        "activa": true
    }
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('categoriaNombreCliente', 'Categoria Cliente ' + Date.now());
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status 403 - rol insuficiente', function () {
          pm.response.to.have.status(403);
      });
    language: text/javascript
order: 3000