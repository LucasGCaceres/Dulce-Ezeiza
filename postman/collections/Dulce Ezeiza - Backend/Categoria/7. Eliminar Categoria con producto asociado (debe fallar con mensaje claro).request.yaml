$kind: http-request
description: "Usa {{categoriaSeedId}} (categoria del seed, 'Panaderia' por defecto), que siempre tiene 4 productos precargados -- asi esta prueba
  no depende de que la carpeta Producto haya corrido antes para generar el producto asociado. La categoria tiene que sobrevivir a este intento de borrado."
url: "{{baseUrl}}/categorias/{{categoriaSeedId}}"
method: DELETE
headers:
  x-access-token: "{{tokenAdmin}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 400', function () {
          pm.response.to.have.status(400);
      });
      pm.test('Mensaje claro de regla de negocio, no el error crudo de SQL', function () {
          const jsonData = pm.response.json();
          pm.expect(jsonData.mensaje).to.eql('No se puede eliminar la categoria: tiene productos asociados');
      });
    language: text/javascript
order: 7000