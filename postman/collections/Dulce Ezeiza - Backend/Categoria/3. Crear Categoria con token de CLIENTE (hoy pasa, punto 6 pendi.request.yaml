$kind: http-request
description: "Desde que armamos el punto 6 (verificarAdmin), un token de cliente valido ya no alcanza para crear una categoria: la autenticacion es correcta 
  (sabemos quien es), pero la autorizacion falla (no tiene el rol). Si esto te sigue dando 201, revisa que hayas vuelto a hacer login DESPUES de agregar rol 
  al payload del JWT -- un token viejo no tiene rol adentro."
url: "{{baseUrl}}/categorias"
method: POST
headers:
  Content-Type: application/json
  x-access-token: "{{tokenCliente}}"
body:
  type: json
  content: |-
    {
        "nombre": "{{categoriaNombreCliente}}",
        "descripcion": "Creada con token de cliente",
        "activa": true
    }
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('categoriaNombreCliente', 'Categoria Cliente ' + Date.now());
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status 403 - rol insuficiente', function () {
          pm.response.to.have.status(403);
      });
    language: text/javascript
order: 3000