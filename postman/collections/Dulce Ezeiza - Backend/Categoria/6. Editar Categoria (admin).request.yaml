$kind: http-request
url: "{{baseUrl}}/categorias/{{categoriaId}}"
method: PUT
headers:
  Content-Type: application/json
  x-access-token: "{{tokenAdmin}}"
body:
  type: json
  content: |-
    {
        "descripcion": "Editada por la coleccion de Postman"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 6000
