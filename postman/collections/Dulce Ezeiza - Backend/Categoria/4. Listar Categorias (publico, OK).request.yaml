$kind: http-request
description: Ademas de la categoria creada en la request 1, esta lista tiene que incluir las 6 categorias precargadas por el seed.
url: "{{baseUrl}}/categorias"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Devuelve un array', function () {
          pm.expect(pm.response.json()).to.be.an('array');
      });
      pm.test('Incluye al menos las 6 categorias del seed', function () {
          pm.expect(pm.response.json().length).to.be.at.least(6);
      });
    language: text/javascript
order: 4000
